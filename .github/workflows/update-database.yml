name: Twice-Daily Fuel Prices & Release Builder

on:
  schedule:
    # GitHub cron is best-effort and often drops/delays morning jobs.
    # Primary + backup slots (~90m later). cancel-in-progress is false so a
    # late backup still publishes if the primary never started.
    # Off-peak minutes (not :00) to reduce queue drops.
    # Athens summer (UTC+3): 07:17 / 08:47 and 15:23 / 16:53
    - cron: '17 4 * * *'
    - cron: '47 5 * * *'
    - cron: '23 12 * * *'
    - cron: '53 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuelprices-updater
  cancel-in-progress: false

jobs:
  scrape-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install

      - name: Set up Cloudflare WARP
        uses: fscarmen/warp-on-actions@v1.4
        continue-on-error: true
        with:
          stack: dual
          mode: wireguard

      - name: Run prefecture fuel prices scraper
        run: python scraper.py

      - name: Run station-level fuel prices scraper
        id: stations
        continue-on-error: true
        run: node scraper.js

      # fuelgr.gr often returns an HTML challenge to GitHub datacenter IPs;
      # a cooldown + second try usually clears a transient throttle.
      - name: Retry station scraper after cooldown
        if: steps.stations.outcome == 'failure'
        id: stations_retry
        continue-on-error: true
        run: |
          echo "First scrape failed (likely HTML/IP block). Waiting 2 minutes..."
          sleep 120
          node scraper.js

      - name: Fallback to existing stations dataset if scrape blocked
        if: steps.stations.outcome == 'failure' && steps.stations_retry.outcome == 'failure'
        run: |
          echo "::warning::Station scraper blocked on both attempts. Restoring previous release stations dataset..."
          mkdir -p data
          curl -fsSL "https://github.com/${{ github.repository }}/releases/latest/download/stations_latest.min.json" -o data/stations_latest.min.json || true

      - name: Package dataset and compress with zstd
        run: python package_dataset.py

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(cat dist/tag.txt)
          echo "Publishing release ${TAG} at ${GITHUB_SHA}..."
          ASSETS=(
            "dist/stations_latest.min.json"
            "dist/stations_latest.min.json.zst"
            "dist/stations_latest.json"
            "dist/price_ledger.min.json"
            "dist/price_ledger.min.json.zst"
            "dist/prefectures_latest.min.json"
            "dist/prefectures_latest.min.json.zst"
            "dist/prefectures_latest.json"
            "dist/reviews.min.json"
            "dist/reviews.min.json.zst"
          )

          # Keep the proven path: notes edit + asset upload.
          # Do NOT pass --target on edit — GITHUB_TOKEN often gets
          # HTTP 403 "Resource not accessible by integration" when
          # retargeting an existing release tag (regression from the
          # Sep 23 tag-push workaround).
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists. Updating notes and assets..."
            gh release edit "${TAG}" \
              --title "FuelGR Dataset ${TAG}" \
              --notes-file dist/release_notes.md
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          else
            echo "Creating new release ${TAG}..."
            gh release create "${TAG}" "${ASSETS[@]}" \
              --title "FuelGR Dataset ${TAG}" \
              --notes-file dist/release_notes.md \
              --latest
          fi
