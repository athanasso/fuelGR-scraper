name: Twice-Daily Fuel Prices & Release Builder

on:
  schedule:
    # 08:00 & 14:00 EEST → 05:00 & 11:00 UTC
    - cron: '0 5,11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuelprices-updater
  cancel-in-progress: false

jobs:
  scrape-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install

      - name: Run prefecture fuel prices scraper
        run: python scraper.py

      - name: Run station-level fuel prices scraper
        run: node scraper.js


      - name: Package dataset and compress with zstd
        run: python package_dataset.py

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(cat dist/tag.txt)
          echo "Publishing release ${TAG} at ${GITHUB_SHA}..."
          ASSETS=(
            "dist/stations_latest.min.json"
            "dist/stations_latest.min.json.zst"
            "dist/stations_latest.json"
            "dist/price_ledger.min.json"
            "dist/price_ledger.min.json.zst"
            "dist/prefectures_latest.min.json"
            "dist/prefectures_latest.min.json.zst"
            "dist/prefectures_latest.json"
            "dist/reviews.min.json"
            "dist/reviews.min.json.zst"
          )

          # Keep the date tag pointed at this workflow run's commit so
          # GitHub no longer shows "N commits since this release".
          git tag -f "${TAG}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${TAG}"

          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists. Updating target, notes, and assets..."
            gh release edit "${TAG}" \
              --title "FuelGR Dataset ${TAG}" \
              --notes-file dist/release_notes.md \
              --target "${GITHUB_SHA}" \
              --latest
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          else
            echo "Creating new release ${TAG}..."
            gh release create "${TAG}" "${ASSETS[@]}" \
              --title "FuelGR Dataset ${TAG}" \
              --notes-file dist/release_notes.md \
              --target "${GITHUB_SHA}" \
              --latest
          fi
