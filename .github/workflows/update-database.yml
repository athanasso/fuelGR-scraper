name: Daily Fuel Prices & Release Builder

on:
  schedule:
    # 14:00 EEST is 11:00 UTC (runs daily)
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuelprices-updater
  cancel-in-progress: false

jobs:
  scrape-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run prefecture fuel prices scraper
        run: python scraper.py

      - name: Run station-level fuel prices scraper
        run: node scraper.js

      - name: Package dataset and compress with zstd
        run: python package_dataset.py

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(cat dist/tag.txt)
          echo "Publishing release ${TAG}..."
          ASSETS=(
            "dist/stations_latest.min.json"
            "dist/stations_latest.min.json.zst"
            "dist/stations_latest.json"
            "dist/prefectures_latest.min.json"
            "dist/prefectures_latest.min.json.zst"
            "dist/prefectures_latest.json"
          )
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists. Updating release notes and uploading assets..."
            gh release edit "${TAG}" --notes-file dist/release_notes.md
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          else
            echo "Creating new release ${TAG}..."
            gh release create "${TAG}" "${ASSETS[@]}" \
              --title "FuelGR Dataset ${TAG}" \
              --notes-file dist/release_notes.md \
              --latest
          fi
