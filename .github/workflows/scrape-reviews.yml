name: Bi-Weekly Google Reviews Enrichment

on:
  schedule:
    # Runs at 03:00 UTC on the 1st and 15th of every month (every 2 weeks)
    - cron: '0 3 1,15 * *'
  workflow_dispatch:
    inputs:
      delay_min:
        description: 'Minimum jitter delay per station in ms'
        required: false
        default: '3000'
      delay_max:
        description: 'Maximum jitter delay per station in ms'
        required: false
        default: '6000'

permissions:
  contents: write

concurrency:
  group: fuelgr-reviews-updater
  cancel-in-progress: false

jobs:
  scrape-matrix:
    name: Scrape Shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Download latest stations snapshot from release
        run: |
          mkdir -p data
          curl -sL "https://github.com/athanasso/fuelGR-scraper/releases/latest/download/stations_latest.min.json" -o data/stations_latest.min.json || true
          curl -sL "https://github.com/athanasso/fuelGR-scraper/releases/latest/download/reviews.min.json" -o data/reviews.min.json || true

      - name: Run parallel shard scraper
        continue-on-error: true
        run: |
          DELAY_MIN="${{ github.event.inputs.delay_min || '3000' }}"
          DELAY_MAX="${{ github.event.inputs.delay_max || '6000' }}"
          echo "Starting shard ${{ matrix.shard }}/6 with delay=${DELAY_MIN}-${DELAY_MAX}ms..."
          node reviews_scraper.js --shard ${{ matrix.shard }} --total-shards 6 --max-time-min 140 --delay-min "${DELAY_MIN}" --delay-max "${DELAY_MAX}" --input data/stations_latest.min.json

      - name: Upload Shard Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviews-shard-${{ matrix.shard }}
          path: data/reviews_shard_${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 1

  merge-and-release:
    name: Merge Shards & Publish Release
    needs: scrape-matrix
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download latest dataset baseline from release
        run: |
          mkdir -p data dist
          curl -sL "https://github.com/athanasso/fuelGR-scraper/releases/latest/download/stations_latest.min.json" -o data/stations_latest.min.json || true
          curl -sL "https://github.com/athanasso/fuelGR-scraper/releases/latest/download/reviews.min.json" -o data/reviews.min.json || true
          curl -sL "https://github.com/athanasso/fuelGR-scraper/releases/latest/download/price_ledger.min.json" -o data/price_ledger.min.json || true

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: shards

      - name: Merge all review shards
        run: node merge_reviews.js

      - name: Package master dataset with enriched reviews
        run: python package_dataset.py

      - name: Update GitHub Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --json tagName -q .tagName)
          echo "Updating assets on release ${TAG}..."
          if [ -f "dist/reviews.min.json" ]; then
            gh release upload "${TAG}" "dist/reviews.min.json" "dist/reviews.min.json.zst" "dist/stations_latest.min.json" "dist/stations_latest.min.json.zst" --clobber
          fi
