name: Bi-Weekly Google Reviews Enrichment

on:
  schedule:
    # Runs at 03:00 UTC on the 1st and 15th of every month (every 2 weeks)
    - cron: '0 3 1,15 * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum stations to scrape in this run (0 for time-budgeted batch)'
        required: false
        default: '0'
      max_time_min:
        description: 'Time budget in minutes before clean exit & packaging'
        required: false
        default: '150'
      concurrency:
        description: 'Browser contexts in parallel (keep at 1 for anti-bot safety)'
        required: false
        default: '1'
      delay_min:
        description: 'Minimum jitter delay per station in ms'
        required: false
        default: '3000'
      delay_max:
        description: 'Maximum jitter delay per station in ms'
        required: false
        default: '6000'

permissions:
  contents: write

concurrency:
  group: fuelgr-reviews-updater
  cancel-in-progress: false

jobs:
  scrape-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install
          npx playwright install --with-deps chromium

      - name: Download latest stations snapshot from release
        run: |
          mkdir -p data dist
          curl -sL "https://github.com/athanasso/fuelGR-scraper/releases/latest/download/stations_latest.min.json" -o data/stations_latest.min.json || true
          curl -sL "https://github.com/athanasso/fuelGR-scraper/releases/latest/download/reviews.min.json" -o data/reviews.min.json || true

      - name: Run slow stealth reviews scraper
        continue-on-error: true
        run: |
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          MAX_TIME="${{ github.event.inputs.max_time_min || '150' }}"
          CONCURRENCY="${{ github.event.inputs.concurrency || '1' }}"
          DELAY_MIN="${{ github.event.inputs.delay_min || '3000' }}"
          DELAY_MAX="${{ github.event.inputs.delay_max || '6000' }}"
          echo "Starting slow scraper with limit=${LIMIT}, max_time=${MAX_TIME}m, concurrency=${CONCURRENCY}, delay=${DELAY_MIN}-${DELAY_MAX}ms..."
          node reviews_scraper.js --limit "${LIMIT}" --max-time-min "${MAX_TIME}" --concurrency "${CONCURRENCY}" --delay-min "${DELAY_MIN}" --delay-max "${DELAY_MAX}" --input data/stations_latest.min.json

      - name: Package updated reviews dataset
        if: always()
        run: |
          if [ -f "data/reviews.min.json" ]; then
            python package_dataset.py
          fi

      - name: Update GitHub Release Assets with Fresh Reviews
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --json tagName -q .tagName)
          echo "Updating assets on release ${TAG}..."
          if [ -f "dist/reviews.min.json" ]; then
            gh release upload "${TAG}" "dist/reviews.min.json" "dist/reviews.min.json.zst" "dist/stations_latest.min.json" "dist/stations_latest.min.json.zst" --clobber
          fi
