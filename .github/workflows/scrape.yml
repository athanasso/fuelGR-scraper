name: Scrape Fuel Prices & Deploy API

on:
  schedule:
    # 14:00 EEST is 11:00 UTC (runs daily)
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuelprices-scraper
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fuel prices scraper
        run: python scraper.py

      - name: Prepare static files for GitHub Pages
        run: |
          mkdir -p public/data
          # Copy to /data/prefectures_latest.json
          cp data/prefectures_latest.json public/data/prefectures_latest.json
          # Copy dated snapshot(s) to public/data/
          cp data/prefectures_*.json public/data/
          # Also expose at root /prefectures_latest.json
          cp data/prefectures_latest.json public/prefectures_latest.json
          # Prevent Jekyll from ignoring files or underscores
          touch public/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Update fuel prices data [skip ci]'
